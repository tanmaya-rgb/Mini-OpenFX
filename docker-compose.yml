services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: miniopenfx
      POSTGRES_PASSWORD: miniopenfx
      POSTGRES_DB: miniopenfx
    ports:
      - '5432:5432'
    volumes:
      - miniopenfx-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U miniopenfx -d miniopenfx']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  miniopenfx-postgres-data:
